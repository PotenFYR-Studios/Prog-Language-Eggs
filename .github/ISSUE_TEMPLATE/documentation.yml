name: Documentation
description: Report a docs gap or error on the documentation site or README.
labels: ["documentation"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where is the problem?
      options:
        - Documentation site (prog-language-eggs.docs.potenfyr.in)
        - README
        - CONTRIBUTING / SECURITY
        - Egg JSON descriptions
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: Docs page (if site)
      options:
        - "/"
        - "/docs"
        - "/docs/eggs"
        - "/docs/languages"
        - "/examples"
        - "/about"
        - "N/A"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: Note that site content (languages, variables, images) is generated from the real egg JSON; if a value is wrong there, the egg JSON is the thing to fix.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
