name: Deploy Documentation to GitHub Pages

# Docs are generated from the real egg JSON + README language matrix, so
# content-affecting files all trigger a rebuild.
on:
  push:
    branches: [ "master" ]
    paths:
      - "docs/**"
      - "README.md"
      - "egg-programming-multi.json"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "egg-programming-multi.json"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

# Least privilege: deploy job elevates via its own permissions block.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Runs before the build so the base path can adapt to the serving URL;
      # also enables Pages (build_type: workflow) on first run.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: docs
        run: bun run prebuild && bunx tsc --noEmit

      # Hybrid base: custom domain -> root path; otherwise
      # /Prog-Language-Eggs/ (github.io project pages serve under the repo
      # slug), so assets and links resolve in both deployments.
      - name: Build docs site (prebuild + vite)
        working-directory: docs
        run: |
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          case "$BASE_URL" in
            ""|*github.io*) export VITE_BASE="/Prog-Language-Eggs/" ;;
            *) export VITE_BASE="/" ;;
          esac
          bun run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
