name: Build and Publish Multi-Arch Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: potenfyr-studios/prog-language-eggs

jobs:
  build-and-push-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: all
            tag: latest
          - variant: bun
            tag: bun
          - variant: nodejs
            tag: nodejs
          - variant: python
            tag: python
          - variant: golang
            tag: golang
          - variant: rust
            tag: rust
          - variant: php
            tag: php
          - variant: ruby
            tag: ruby
          - variant: java
            tag: java
          - variant: dotnet
            tag: dotnet
          - variant: c-cpp
            tag: c-cpp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-architecture emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUNTIME_VARIANT=${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          # Always build from a CLEAN slate: no stale layer caches are reused,
          # so every published tag reflects the exact committed sources.
          no-cache: true